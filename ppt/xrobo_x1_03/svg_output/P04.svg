<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <text x="72" y="78" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" font-weight="600" fill="#0E7490">PROGRAM MAP · 전체 지도</text>
    <text x="72" y="128" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="42" font-weight="700" fill="#1F2937">프로그램은 두 덩어리로 되어 있다</text>
    <line x1="72" y1="156" x2="1208" y2="156" stroke="#E5E7EB" stroke-width="2"/>
  </g>
  <g id="main-box">
    <rect x="100" y="230" width="440" height="270" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="3"/>
    <text x="132" y="286" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="28" font-weight="700" fill="#1E3A8A">메인 스크립트</text>
    <text x="132" y="330" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="20" fill="#1F2937">시작 → 초기 설정 → 무한 반복</text>
    <text x="132" y="372" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="20" fill="#1F2937">전진·후진·멜로디를 되풀이하는</text>
    <text x="132" y="404" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="20" font-weight="600" fill="#1F2937">자동 시연 루프</text>
    <text x="132" y="458" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#6B7280">매 바퀴 시작마다 함수를 10번 호출</text>
  </g>
  <g id="func-box">
    <rect x="740" y="230" width="440" height="270" fill="#FFFFFF" stroke="#0E7490" stroke-width="3"/>
    <text x="772" y="286" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="28" font-weight="700" fill="#0E7490">함수 「엑스쿠터 컨트롤」</text>
    <text x="772" y="330" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="20" fill="#1F2937">리모컨 값(A6)을 확인해서</text>
    <text x="772" y="362" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="20" fill="#1F2937">1번이 눌리면 내부 무한 루프의</text>
    <text x="772" y="404" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="20" font-weight="600" fill="#1F2937">리모컨 제어 모드로 전환</text>
    <text x="772" y="458" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#F97316">한 번 들어가면 메인으로 복귀하지 않음</text>
  </g>
  <g id="arrows">
    <line x1="540" y1="330" x2="732" y2="330" stroke="#1E3A8A" stroke-width="3"/>
    <path d="M 732 330 L 716 322 L 716 338 Z" fill="#1E3A8A"/>
    <text x="560" y="312" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" font-weight="600" fill="#1E3A8A">호출 (0.2초 간격 ×10)</text>
    <line x1="740" y1="420" x2="548" y2="420" stroke="#F97316" stroke-width="3"/>
    <path d="M 548 420 L 564 412 L 564 428 Z" fill="#F97316"/>
    <text x="566" y="450" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" font-weight="600" fill="#F97316">A6 ≠ 1이면 즉시 복귀</text>
  </g>
  <g id="lead">
    <text x="100" y="580" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="28" font-weight="600" fill="#1F2937">리모컨 1번 버튼이 눌리는 순간, 프로그램의 주도권이 함수 안으로 넘어간다</text>
  </g>
  <g id="footer">
    <line x1="72" y1="664" x2="1208" y2="664" stroke="#E5E7EB" stroke-width="1"/>
    <text x="72" y="694" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#6B7280">로봇 소프트웨어 개발 · 공동교육과정</text>
    <text x="1208" y="694" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#6B7280">XROBO Extreme X1 · 04</text>
  </g>
</svg>
