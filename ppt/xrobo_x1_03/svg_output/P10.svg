    <text x="120" y="200" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#6B7280">막대 위 숫자 = 블록에 적힌 주파수(Hz), 높이가 높을수록 높은 음</text>
