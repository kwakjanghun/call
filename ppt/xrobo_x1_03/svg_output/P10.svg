  <g id="timing">
    <rect x="72" y="490" width="1136" height="60" fill="#F3F4F6"/>
    <rect x="72" y="490" width="4" height="60" fill="#0E7490"/>
    <text x="104" y="528" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="20" fill="#1F2937">한 음마다 「50ms 재생 + 100ms 쉬기」 — 쉬는 시간이 있어야 같은 음도 두 번으로 또렷이 들린다</text>
  </g>
  <g id="theory">
    <text x="72" y="596" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="20" fill="#1F2937">주파수가 2배가 되면 한 옥타브 위 음이 된다 (도4 = 262Hz → 도5 = 523Hz). 부저는 초당 진동수만큼</text>
    <text x="72" y="628" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="20" fill="#1F2937">떨리는 소리를 내므로, 블록의 숫자를 바꾸는 것만으로 어떤 멜로디든 만들 수 있다.</text>
  </g>
