<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <text x="72" y="78" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" font-weight="600" fill="#0E7490">CODE READING 6 · 함수 2부</text>
    <text x="72" y="128" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="42" font-weight="700" fill="#1F2937">중첩 if-else — 리모컨 값이 동작을 고른다</text>
    <line x1="72" y1="156" x2="1208" y2="156" stroke="#E5E7EB" stroke-width="2"/>
  </g>
  <g id="code-panel">
    <rect x="72" y="190" width="560" height="380" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="72" y="190" width="4" height="380" fill="#1E3A8A"/>
    <text x="108" y="238" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#1E3A8A">무한 반복하기</text>
    <text x="108" y="278" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#0E7490">  만약 A6 = 1 이면</text>
    <text x="108" y="310" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#1F2937">    모터 좌 20 우 20 (계속)</text>
    <text x="108" y="350" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#0E7490">  아니면 만약 A6 = 2 이면</text>
    <text x="108" y="382" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#1F2937">    모터 좌 -20 우 -20 (계속)</text>
    <text x="108" y="422" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#0E7490">  아니면 만약 A6 = 5 이면</text>
    <text x="108" y="454" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#F97316">    멜로디 7음 연주</text>
    <text x="108" y="494" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#0E7490">  아니면</text>
    <text x="108" y="526" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#1F2937">    모터 좌 0 우 0 (정지)</text>
  </g>
  <g id="branch-table">
    <rect x="680" y="190" width="528" height="52" fill="#1E3A8A"/>
    <text x="712" y="224" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">버튼 값</text>
    <text x="880" y="224" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">로봇의 동작</text>
    <rect x="680" y="242" width="528" height="66" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="712" y="284" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#1E3A8A">1</text>
    <text x="880" y="284" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="20" fill="#1F2937">전진 — 좌 20 · 우 20</text>
    <rect x="680" y="308" width="528" height="66" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
    <text x="712" y="350" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#1E3A8A">2</text>
    <text x="880" y="350" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="20" fill="#1F2937">후진 — 좌 -20 · 우 -20</text>
    <rect x="680" y="374" width="528" height="66" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="712" y="416" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#F97316">5</text>
    <text x="880" y="416" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="20" fill="#1F2937">멜로디 — 도레미레도레미</text>
    <rect x="680" y="440" width="528" height="66" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
    <text x="712" y="482" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#6B7280">기타</text>
    <text x="880" y="482" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="20" fill="#1F2937">정지 — 좌 0 · 우 0</text>
  </g>
  <g id="insight">
    <text x="680" y="548" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">위에서부터 차례로 검사하다 처음 참이 되는 가지 하나만 실행된다.</text>
  </g>
  <g id="note">
    <rect x="72" y="588" width="1136" height="46" fill="#F3F4F6"/>
    <rect x="72" y="588" width="4" height="46" fill="#F97316"/>
    <text x="104" y="618" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">버튼을 떼면 A6 값이 1·2·5 어디에도 해당하지 않으므로 마지막 「아니면」 가지가 로봇을 멈춘다 — 안전장치이기도 하다</text>
  </g>
  <g id="footer">
    <line x1="72" y1="664" x2="1208" y2="664" stroke="#E5E7EB" stroke-width="1"/>
    <text x="72" y="694" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#6B7280">로봇 소프트웨어 개발 · 공동교육과정</text>
    <text x="1208" y="694" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#6B7280">XROBO Extreme X1 · 12</text>
  </g>
</svg>
