<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <text x="72" y="78" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" font-weight="600" fill="#0E7490">CODE READING 2 · 메인 루프</text>
    <text x="72" y="128" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="42" font-weight="700" fill="#1F2937">무한 반복 안의 네 단계</text>
    <line x1="72" y1="156" x2="1208" y2="156" stroke="#E5E7EB" stroke-width="2"/>
  </g>
  <g id="code-panel">
    <rect x="72" y="190" width="520" height="440" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="72" y="190" width="4" height="440" fill="#1E3A8A"/>
    <text x="108" y="238" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#1E3A8A">무한 반복하기</text>
    <text x="108" y="278" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" fill="#0E7490">  10번 반복하기</text>
    <text x="108" y="310" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#1F2937">    엑스쿠터 컨트롤 (호출)</text>
    <text x="108" y="342" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#1F2937">    0.2초 기다리기</text>
    <text x="108" y="390" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#1F2937">  모터 좌 10 우 10 (1000ms)</text>
    <text x="108" y="422" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#1F2937">  0.5초 기다리기</text>
    <text x="108" y="462" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#1F2937">  모터 좌 -10 우 -10 (1000ms)</text>
    <text x="108" y="494" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#1F2937">  0.5초 기다리기</text>
    <text x="108" y="542" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#F97316">  소리 523·587·659·587·</text>
    <text x="108" y="574" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#F97316">  523·587·659 (7음 연주)</text>
  </g>
  <g id="step1">
    <rect x="640" y="190" width="568" height="100" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <text x="672" y="230" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A">① 리모컨 감지 구간 — 약 2초</text>
    <text x="672" y="264" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">함수 호출 + 0.2초 대기를 10번 = 폴링 (다음 장)</text>
  </g>
  <g id="step2">
    <rect x="640" y="304" width="568" height="100" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <text x="672" y="344" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A">② 전진 1초 → 0.5초 정지</text>
    <text x="672" y="378" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">좌·우 모두 +10, 1000ms 동안 굴러간다</text>
  </g>
  <g id="step3">
    <rect x="640" y="418" width="568" height="100" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <text x="672" y="458" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A">③ 후진 1초 → 0.5초 정지</text>
    <text x="672" y="492" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">부호만 바꾼 -10, -10 — 제자리로 돌아온다</text>
  </g>
  <g id="step4">
    <rect x="640" y="532" width="568" height="100" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <text x="672" y="572" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="20" font-weight="700" fill="#F97316">④ 멜로디 7음 연주</text>
    <text x="672" y="606" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">도5 레5 미5 레5 도5 레5 미5 — 그리고 처음으로</text>
  </g>
  <g id="footer">
    <line x1="72" y1="664" x2="1208" y2="664" stroke="#E5E7EB" stroke-width="1"/>
    <text x="72" y="694" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#6B7280">로봇 소프트웨어 개발 · 공동교육과정</text>
    <text x="1208" y="694" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#6B7280">XROBO Extreme X1 · 07</text>
  </g>
</svg>
