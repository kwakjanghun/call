<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <text x="72" y="78" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" font-weight="600" fill="#0E7490">WRAP-UP · 개념 정리</text>
    <text x="72" y="128" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="42" font-weight="700" fill="#1F2937">한 소스에 담긴 프로그래밍 구조 4가지</text>
    <line x1="72" y1="156" x2="1208" y2="156" stroke="#E5E7EB" stroke-width="2"/>
  </g>
  <g id="card-seq">
    <rect x="72" y="190" width="552" height="212" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="72" y="190" width="552" height="6" fill="#1E3A8A"/>
    <use data-icon="chunk-filled/list-ordered" x="104" y="226" width="36" height="36" fill="#1E3A8A"/>
    <text x="160" y="252" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2937">순차 (Sequence)</text>
    <text x="104" y="304" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">블록은 위에서 아래로 한 줄씩 실행된다.</text>
    <text x="104" y="336" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#6B7280">소스 속 위치 · 초기 설정 두 줄, 멜로디 7음의 순서</text>
    <text x="104" y="368" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#6B7280">전진 → 대기 → 후진의 고정된 차례</text>
  </g>
  <g id="card-loop">
    <rect x="656" y="190" width="552" height="212" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="656" y="190" width="552" height="6" fill="#F97316"/>
    <use data-icon="chunk-filled/arrows-repeat" x="688" y="226" width="36" height="36" fill="#F97316"/>
    <text x="744" y="252" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2937">반복 (Loop)</text>
    <text x="688" y="304" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">같은 코드를 정해진 횟수 또는 무한히 되풀이한다.</text>
    <text x="688" y="336" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#6B7280">소스 속 위치 · 무한 반복 2곳(메인·함수),</text>
    <text x="688" y="368" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#6B7280">10번 반복하기(폴링)</text>
  </g>
  <g id="card-select">
    <rect x="72" y="426" width="552" height="212" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="72" y="426" width="552" height="6" fill="#0E7490"/>
    <use data-icon="chunk-filled/git-fork" x="104" y="462" width="36" height="36" fill="#0E7490"/>
    <text x="160" y="488" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2937">선택 (Selection)</text>
    <text x="104" y="540" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">조건의 참·거짓에 따라 실행할 가지를 고른다.</text>
    <text x="104" y="572" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#6B7280">소스 속 위치 · 진입 조건 if 1곳,</text>
    <text x="104" y="604" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#6B7280">3단 중첩 if-else (1·2·5·기타)</text>
  </g>
  <g id="card-func">
    <rect x="656" y="426" width="552" height="212" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="656" y="426" width="552" height="6" fill="#1E3A8A"/>
    <use data-icon="chunk-filled/code-block" x="688" y="462" width="36" height="36" fill="#1E3A8A"/>
    <text x="744" y="488" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2937">함수 (Function)</text>
    <text x="688" y="540" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">코드 묶음에 이름을 붙여 필요할 때 불러 쓴다.</text>
    <text x="688" y="572" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#6B7280">소스 속 위치 · 「엑스쿠터 컨트롤」 정의 1곳,</text>
    <text x="688" y="604" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#6B7280">메인 루프에서 10번 호출</text>
  </g>
  <g id="footer">
    <line x1="72" y1="664" x2="1208" y2="664" stroke="#E5E7EB" stroke-width="1"/>
    <text x="72" y="694" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#6B7280">로봇 소프트웨어 개발 · 공동교육과정</text>
    <text x="1208" y="694" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#6B7280">XROBO Extreme X1 · 14</text>
  </g>
</svg>
