<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="header">
    <text x="72" y="78" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" font-weight="600" fill="#0E7490">OVERVIEW · 수업 개요</text>
    <text x="72" y="128" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="42" font-weight="700" fill="#1F2937">어떤 수업에서, 무엇으로 배우나</text>
    <line x1="72" y1="156" x2="1208" y2="156" stroke="#E5E7EB" stroke-width="2"/>
  </g>
  <g id="card-subject">
    <rect x="72" y="190" width="352" height="400" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="72" y="190" width="352" height="6" fill="#1E3A8A"/>
    <use data-icon="chunk-filled/book-open" x="104" y="228" width="44" height="44" fill="#1E3A8A"/>
    <text x="104" y="322" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2937">과목</text>
    <text x="104" y="366" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">공동교육과정으로 개설되는</text>
    <text x="104" y="396" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" font-weight="600" fill="#1E3A8A">「로봇 소프트웨어 개발」</text>
    <text x="104" y="438" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">여러 학교 학생이 함께 듣는</text>
    <text x="104" y="468" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">심화 선택 과목으로, 소프트웨어로</text>
    <text x="104" y="498" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">로봇을 제어하는 방법을 배운다</text>
  </g>
  <g id="card-kit">
    <rect x="464" y="190" width="352" height="400" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="464" y="190" width="352" height="6" fill="#F97316"/>
    <use data-icon="chunk-filled/robot" x="496" y="228" width="44" height="44" fill="#F97316"/>
    <text x="496" y="322" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2937">교구</text>
    <text x="496" y="366" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" font-weight="600" fill="#F97316">XROBO Extreme X1 키트</text>
    <text x="496" y="408" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">DC 모터 2개 · 부저 ·</text>
    <text x="496" y="438" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">RF 리모컨 수신부를 갖춘 로봇</text>
    <text x="496" y="480" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">mBlock 5의 전용 확장 블록으로</text>
    <text x="496" y="510" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">프로그래밍해 업로드한다</text>
  </g>
  <g id="card-goal">
    <rect x="856" y="190" width="352" height="400" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
    <rect x="856" y="190" width="352" height="6" fill="#0E7490"/>
    <use data-icon="chunk-filled/target" x="888" y="228" width="44" height="44" fill="#0E7490"/>
    <text x="888" y="322" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2937">오늘의 목표</text>
    <text x="888" y="366" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">1. 3차시 예제 소스의 전체 구조</text>
    <text x="888" y="396" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">    파악하기</text>
    <text x="888" y="438" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">2. 블록별 파라미터의 의미</text>
    <text x="888" y="468" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">    설명하기</text>
    <text x="888" y="510" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="18" fill="#1F2937">3. 제어 구조 4가지 찾아내기</text>
  </g>
  <g id="footer">
    <line x1="72" y1="664" x2="1208" y2="664" stroke="#E5E7EB" stroke-width="1"/>
    <text x="72" y="694" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#6B7280">로봇 소프트웨어 개발 · 공동교육과정</text>
    <text x="1208" y="694" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', Arial, sans-serif" font-size="16" fill="#6B7280">XROBO Extreme X1 · 02</text>
  </g>
</svg>
